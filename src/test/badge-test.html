<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Face Fit — тест бейджа</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; margin: 24px; background: #fff; color: #111; }
    .grid { display: grid; grid-template-columns: repeat(3, 200px); gap: 16px; margin-top: 16px; }
    .grid img { width: 200px; height: 280px; object-fit: cover; border: 1px solid #ddd; border-radius: 6px; }
    pre { background: #f4f4f5; padding: 10px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Тест бейджа (6.2)</h1>
  <p>Наведи на «заменённую» картинку → бейдж внизу-слева. Клик по кнопке — оригинал / замена.</p>
  <div class="grid" id="grid"></div>
  <pre id="log">—</pre>

  <script type="module">
    // Вне расширения chrome.i18n недоступен — минимальная заглушка для стенда.
    window.chrome ??= {};
    window.chrome.i18n ??= {
      getMessage: (key) => ({ badgeShowOriginal: "оригинал", badgeRestoreFace: "вернуть лицо" })[key] ?? key,
    };

    import { initBadge } from "../content/badge.js";

    const cache = new Map();
    const log = (m) => (document.getElementById("log").textContent = m);

    // Данные-картинки без сети: цветной прямоугольник с подписью.
    function tile(text, bg) {
      const c = document.createElement("canvas");
      c.width = 200; c.height = 280;
      const x = c.getContext("2d");
      x.fillStyle = bg; x.fillRect(0, 0, 200, 280);
      x.fillStyle = "#fff"; x.font = "bold 28px system-ui"; x.textAlign = "center";
      x.fillText(text, 100, 150);
      return c.toDataURL("image/png");
    }

    const grid = document.getElementById("grid");
    for (let i = 0; i < 3; i++) {
      const key = `img-${i}`;
      const orig = tile(`ОРИГИНАЛ ${i}`, "#777");
      const swap = tile(`ЗАМЕНА ${i}`, "#2563eb");
      cache.set(key, swap);
      const img = document.createElement("img");
      img.src = swap;
      img.dataset.facefitDone = "1";
      img.dataset.facefitOrig = orig;
      img.dataset.facefitSrcset = "";
      img.dataset.facefitKey = key;
      grid.appendChild(img);
    }

    function toggleImage(img) {
      if (img.dataset.facefitShown === "orig") {
        img.src = cache.get(img.dataset.facefitKey);
        delete img.dataset.facefitShown;
        log(`swap: ${img.dataset.facefitKey}`);
        return "swap";
      }
      img.src = img.dataset.facefitOrig;
      img.dataset.facefitShown = "orig";
      log(`orig: ${img.dataset.facefitKey}`);
      return "orig";
    }

    initBadge(toggleImage);
    log("готово — наведи на картинку");
  </script>
</body>
</html>
